<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="A humpback whale flipper has bumps on its front edge; they make small swirls that keep flow attached at steep angles" font-family="IBM Plex Sans, system-ui, sans-serif"><defs><marker id="vw-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#87BAD9"/></marker><marker id="vw-warm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D98A3D"/></marker><marker id="vw-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#231F20"/></marker><marker id="vw-steel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#33668A"/></marker></defs><rect width="640" height="360" rx="16" fill="#EEF6FA"/><g transform="translate(22 46) scale(.82)"><path d="M118.0,40.0 L113.9,43.8 L110.4,47.7 L107.9,51.5 L106.7,55.3 L106.8,59.2 L108.1,63.0 L110.3,66.8 L112.9,70.7 L109.0,74.5 L105.7,78.3 L103.3,82.2 L102.1,86.0 L102.1,89.8 L103.3,93.7 L105.3,97.5 L107.8,101.3 L104.1,105.2 L100.9,109.0 L98.6,112.8 L97.5,116.7 L97.5,120.5 L98.6,124.3 L100.4,128.2 L102.7,132.0 L99.2,135.8 L96.2,139.7 L94.0,143.5 L92.9,147.3 L92.8,151.2 L93.8,155.0 L95.5,158.8 L97.6,162.7 L94.3,166.5 L91.4,170.3 L89.3,174.2 L88.2,178.0 L88.2,181.8 L89.0,185.7 L90.6,189.5 L92.4,193.3 L89.3,197.2 L86.7,201.0 L84.7,204.8 L83.6,208.7 L83.5,212.5 L84.3,216.3 L85.7,220.2 L87.3,224.0 L84.4,227.8 L81.9,231.7 L80.0,235.5 L79.0,239.3 L78.9,243.2 L79.5,247.0 L80.7,250.8 L82.2,254.7 L79.5,258.5 L77.1,262.3 L75.4,266.2 L74.4,270.0 L74.2,273.8 L74.8,277.7 L75.8,281.5 L77.1,285.3 L74.6,289.2 L72.4,293.0 L70.7,296.8 L69.8,300.7 L69.6,304.5 L70.0,308.3 L70.9,312.2 L72.0,316.0 Q100,330 112,310 C140,250 150,120 150,60 Q148,30 118,40 Z" fill="#0A4564"/></g><text x="110" y="350" font-size="12" fill="#33668A" text-anchor="middle">flipper seen from above</text><circle cx="12" cy="22" r="12" fill="#0A4564"/><text x="12" y="26" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="32" y="27" font-size="14" fill="#231F20" text-anchor="start">Bumps along</text><text x="32" y="45" font-size="14" fill="#231F20" text-anchor="start">the front edge</text><line x1="200" y1="10" x2="200" y2="350" stroke="#D5E4EC" stroke-width="1.5"/><text x="220" y="30" font-size="14" font-weight="700" fill="#231F20">Smooth edge, steep angle</text><path d="M220,70 H300" stroke="#87BAD9" stroke-width="2" fill="none"/><path d="M220,92 H300" stroke="#87BAD9" stroke-width="2" fill="none"/><g transform="translate(310 100) rotate(16)"><path d="M0,0 C10,-26 110,-30 230,0 C110,8 10,14 0,0 Z" fill="#5C7F96"/></g><path d="M220,92 H300 C320,80 345,64 380,58 C420,52 460,60 520,48" stroke="#87BAD9" stroke-width="2" fill="none" marker-end="url(#vw-sky)"/><path d="M220,70 H300 C330,56 380,40 520,30" stroke="#87BAD9" stroke-width="2" fill="none" marker-end="url(#vw-sky)"/><path d="M432,96 a12,12 0 1 1 -24,0 a8,8 0 1 1 16,4" stroke="#9AA9B3" stroke-width="1.6" fill="none" opacity=".8"/><path d="M480,112 a15,15 0 1 1 -30,0 a10,10 0 1 1 21,4" stroke="#9AA9B3" stroke-width="1.6" fill="none" opacity=".8"/><path d="M528,126 a13,13 0 1 1 -26,0 a9,9 0 1 1 18,4" stroke="#9AA9B3" stroke-width="1.6" fill="none" opacity=".8"/><path d="M570,138 a10,10 0 1 1 -20,0 a7,7 0 1 1 14,4" stroke="#9AA9B3" stroke-width="1.6" fill="none" opacity=".8"/><text x="220" y="150" font-size="13" fill="#6B7B86">flow breaks away: stall</text><text x="220" y="210" font-size="14" font-weight="700" fill="#231F20">With bumps, same angle</text><g transform="translate(310 270) rotate(16)"><path d="M0,0 C10,-26 110,-30 230,0 C110,8 10,14 0,0 Z" fill="#0A4564"/></g><path d="M220,262 H300 C330,240 380,250 420,268 C460,286 500,300 560,318" stroke="#87BAD9" stroke-width="2" fill="none" marker-end="url(#vw-sky)"/><path d="M220,240 H300 C335,214 390,226 440,246 C480,262 520,278 580,296" stroke="#87BAD9" stroke-width="2" fill="none" marker-end="url(#vw-sky)"/><path d="M352,240 a7,7 0 1 1 -14,0 a5,5 0 1 1 10,2" stroke="#33668A" stroke-width="2" fill="none"/><path d="M392,250 a7,7 0 1 1 -14,0 a5,5 0 1 1 10,2" stroke="#33668A" stroke-width="2" fill="none"/><circle cx="480" cy="206" r="12" fill="#0A4564"/><text x="480" y="210" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="500" y="211" font-size="14" fill="#231F20" text-anchor="start">Bumps make</text><text x="500" y="229" font-size="14" fill="#231F20" text-anchor="start">small swirls</text><path d="M468,214 L400,242" stroke="#231F20" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="232" cy="336" r="12" fill="#0A4564"/><text x="232" y="340" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="252" y="341" font-size="14" fill="#231F20" text-anchor="start">Flow stays on, so lift keeps going</text></svg>